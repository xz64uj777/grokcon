name: Verify and publish Ridge Ore

on:
  pull_request:
  push:
    branches:
      - main
      - "hosting/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ridge-ore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The full scripts test glob includes workspace-only .grok/skills
      # fixtures that are intentionally not in the public repository.
      - name: Run repository-portable tests
        run: npm test

      - name: Build standalone mobile browser game
        run: npx vite build --config vite.static.config.ts

      - name: Check cacheable graphics engine and bundle-size budgets
        run: node scripts/check-static-bundle.mjs

      - name: Create GitHub Pages entry point
        run: node -e "require('node:fs').copyFileSync('dist-static/static.html', 'dist-static/index.html')"

      - name: Install Chromium for game smoke tests
        run: npx playwright install --with-deps chromium

      - name: Verify mobile startup, save reload and download recovery
        run: node scripts/game-smoke.mjs

      - name: Upload browser smoke screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-browser-smoke
          path: artifacts/game-smoke
          if-no-files-found: ignore

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
