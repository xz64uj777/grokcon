name: Verify Ridge Ore

on:
  pull_request:
  push:
    branches:
      - main
      - "hosting/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The full scripts test glob includes workspace-only .grok/skills
      # fixtures that are intentionally not in the public repository.
      - name: Run repository-portable tests
        run: >-
          node --experimental-strip-types --test
          src/lib/app-data/app-data.test.ts
          src/lib/app-data/readiness-schedule.test.ts
          src/lib/auth/gate-identity.test.ts
          src/lib/auth/sign-in-gate.test.ts
          src/lib/preview-path-prefix.test.ts

      - name: Build production client/server bundle
        run: npm run build:dev
