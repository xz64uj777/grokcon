name: Verify and publish Ridge Ore

on:
  pull_request:
  push:
    branches:
      - main
      - "hosting/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ridge-ore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The full scripts test glob includes workspace-only .grok/skills
      # fixtures that are intentionally not in the public repository.
      - name: Run repository-portable tests
        run: >-
          node --experimental-strip-types --import ./scripts/register-alias.mjs --test
          src/lib/app-data/app-data.test.ts
          src/lib/app-data/readiness-schedule.test.ts
          src/lib/auth/gate-identity.test.ts
          src/lib/auth/sign-in-gate.test.ts
          src/lib/preview-path-prefix.test.ts
          src/game/controls.test.ts
          src/game/mining.test.ts
          src/game/market.test.ts
          src/game/river.test.ts
          src/game/save.test.ts
          src/game/blast.test.ts
          src/game/lowboy.test.ts
          src/game/pass.test.ts

      - name: Build standalone mobile browser game
        run: npx vite build --config vite.static.config.ts

      - name: Create GitHub Pages entry point
        run: node -e "require('node:fs').copyFileSync('dist-static/static.html', 'dist-static/index.html')"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
